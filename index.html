<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐿️ 花栗鼠泡泡大作战 🫧</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;font-family:'Segoe UI','Microsoft YaHei',sans-serif;overflow:hidden;margin:0;padding:0;width:100vw;height:100vh}
#gameContainer{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:center}
canvas{display:block;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:100%;max-height:100%}
#ui{position:absolute;bottom:20px;left:20px;color:#fff;font-size:17px;font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.6);z-index:10;line-height:1.8}
#ui .score-label{color:#FFD700}
#ui .combo{color:#FF6B9D;font-size:14px;transition:all .3s}
#ui .combo.pop{transform:scale(1.4);color:#00FFAA}
#waveInfo{position:absolute;top:16px;left:20px;color:rgba(255,255,255,.8);font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.5);z-index:10;text-align:left}
#levelInfo{position:absolute;top:80px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.9);font-size:16px;text-align:center;z-index:10;background:rgba(0,0,0,.4);padding:8px 20px;border-radius:12px}
#gameOver,#startScreen{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(145deg,rgba(30,30,60,.97),rgba(20,20,45,.98));padding:48px 56px;border-radius:24px;text-align:center;box-shadow:0 25px 80px rgba(0,0,0,.6);border:1px solid rgba(255,215,0,.2);z-index:20}
#startScreen h1{color:#FFD700;margin-bottom:8px;font-size:32px}
#startScreen p{color:rgba(255,255,255,.7);margin-bottom:28px;line-height:1.7}
#gameOver h2{color:#FF6B6B;margin-bottom:12px;font-size:28px}
#gameOver .final-score{color:#FFD700;font-size:42px;font-weight:bold;margin:16px 0 24px}
.btn{padding:14px 40px;font-size:18px;font-weight:bold;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:50px;cursor:pointer;transition:all .3s;letter-spacing:1px}
.btn:hover{transform:scale(1.08);box-shadow:0 8px 30px rgba(102,126,234,.5)}
#instructions{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.5);font-size:13px;white-space:nowrap;z-index:10}
#instructions kbd{background:rgba(255,255,255,.15);padding:1px 6px;border-radius:4px;border:1px solid rgba(255,255,255,.2);font-size:12px}
.hidden{display:none!important}
#muteBtn{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:#fff}
.float-score{position:absolute;pointer-events:none;font-weight:bold;font-size:22px;animation:floatUp 1s ease-out forwards;z-index:15;text-shadow:0 2px 6px rgba(0,0,0,.5)}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(1.3)}}
#bossHPBar{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:300px;height:14px;background:rgba(0,0,0,.5);border-radius:7px;border:1px solid rgba(255,50,50,.4);z-index:10;display:none}
#bossHPBar .fill{height:100%;background:linear-gradient(90deg,#FF4444,#FF0000);border-radius:7px;transition:width .3s}
#bossHPBar .label{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:bold;text-shadow:0 1px 3px rgba(0,0,0,.8)}
@media (pointer:coarse){
    #ui{bottom:auto;top:8px;left:8px;font-size:14px;line-height:1.6}
    #waveInfo{top:8px;left:8px;font-size:13px}
    #levelInfo{top:55px;font-size:14px;padding:6px 16px}
    #bossHPBar{width:200px;top:42px}
    #muteBtn{width:32px;height:32px;font-size:16px;top:4px}
    #instructions{display:none!important}
    canvas{border-radius:8px}
}
#mobileControls{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;display:none;gap:16px}
@media (pointer:coarse){#mobileControls{display:flex!important}}
#mobileControls .dpad-btn{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.5);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer}
#mobileControls .dpad-btn:active{background:rgba(255,255,255,.25)}
</style>
</head>
<body>
<div id="gameContainer">
<canvas id="gameCanvas" width="900" height="650"></canvas>
<div id="ui">
    <div><span class="score-label">⭐ 得分:</span> <span id="score">0</span></div>
    <div><span class="score-label">❤️ 生命:</span> <span id="lives"></span></div>
    <div id="comboEl" class="combo"></div>
</div>
<div id="waveInfo">
    <div>🗡️ 关卡: <span id="levelNum">1</span></div>
    <div id="levelGoal">🎯 目标: 消灭 10 只</div>
</div>
<div id="bossHPBar"><div class="fill" style="width:100%"></div><div class="label">👾 Boss HP</div></div>
<button id="muteBtn" onclick="toggleMute()">🔊</button>
<div id="startScreen">
    <h1>🐿️ 花栗鼠泡泡大作战 🫧</h1>
    <p>
        🎯 鼠标/↑↓ 瞄准 · 点击/空格 发射泡泡<br>
        ⬅️➡️/A/D 移动 · 被困5秒蜜蜂消灭<br>
        🐝 蜜蜂会发射蜂刺！注意躲避<br>
        🏆 通过10关解锁最终Boss战！
    </p>
    <button class="btn" onclick="startGame()">开始游戏</button>
</div>
<div id="gameOver" class="hidden">
    <h2>游戏结束!</h2>
    <div class="final-score"><span id="finalScore">0</span></div>
    <p style="color:rgba(255,255,255,.6);margin-bottom:20px;">到达关卡: <span id="finalLevel">1</span></p>
    <button class="btn" onclick="restartGame()">再来一局</button>
</div>
<div id="instructions">🖱️ 鼠标瞄准·点击连射 | ⬅️➡️ 移动 | ⬆️⬇️ 调整方向 | 空格 发射</div>
<div id="levelInfo" class="hidden"></div>
    <div id="mobileControls">
        <button class="dpad-btn" id="btnLeft">⬅️</button>
        <button class="dpad-btn" id="btnRight">➡️</button>
    </div>
</div>

<script>
// ===== 音频系统 =====
const AudioSys = (function() {
    let actx = null;
    let bgmPlaying = false;
    let bgmGain = null;
    let muted = false;
    let masterGain = null;

    function init() {
        if (actx) return;
        actx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = actx.createGain();
        masterGain.gain.value = 0.5;
        masterGain.connect(actx.destination);
    }

    function resume() {
        if (actx && actx.state === 'suspended') actx.resume();
    }

    function startBGM() {
        if (!actx || bgmPlaying) return;
        bgmPlaying = true;
        bgmGain = actx.createGain();
        bgmGain.gain.value = muted ? 0 : 0.35;
        bgmGain.connect(masterGain);

        const bpm = 128;
        const beat = 60 / bpm;
        const eighth = beat / 2;
        let nextBar = actx.currentTime + 0.1;
        let barIdx = 0;

        const chords = [
            [262, 330, 392],
            [220, 262, 330],
            [175, 220, 262],
            [196, 247, 294]
        ];

        const melA = [
            523,0,659,0,784,0,659,0, 587,0,523,0,587,0,659,0,
            440,0,523,0,587,0,523,0, 440,0,392,0,440,0,523,0,
            523,0,659,0,784,0,880,0, 784,0,659,0,784,0,880,0,
            784,0,659,0,523,0,587,0, 392,0,494,0,587,0,494,0
        ];

        const melB = [
            784,0,880,0,1047,0,880,0, 784,0,659,0,784,0,659,0,
            587,0,659,0,523,0,587,0, 523,0,440,0,523,0,587,0,
            659,0,784,0,880,0,784,0, 659,0,587,0,523,0,659,0,
            494,0,587,0,494,0,392,0, 523,0,0,0,0,0,0,0
        ];

        const bassLine = [];
        for (let i = 0; i < 16; i++) bassLine.push(chords[0][0] / 2);
        for (let i = 0; i < 16; i++) bassLine.push(chords[1][0] / 2);
        for (let i = 0; i < 16; i++) bassLine.push(chords[2][0] / 2);
        for (let i = 0; i < 16; i++) bassLine.push(chords[3][0] / 2);

        function scheduleBar() {
            if (!bgmPlaying) return;
            const t = nextBar;
            const mel = barIdx < 4 ? melA : melB;
            const noteIdx = (barIdx % 4) * 16;
            const bassOff = (barIdx % 4) * 16;

            for (let i = 0; i < 16; i++) {
                const freq = mel[noteIdx + i];
                if (freq > 0) {
                    playNote(freq, t + i * eighth, eighth * 0.8, 'triangle', bgmGain, 0.09);
                }
            }

            for (let i = 0; i < 16; i++) {
                const freq = bassLine[bassOff + i];
                if (i % 4 === 0 || i % 4 === 3) {
                    playNote(freq, t + i * eighth * 0.5, eighth * 0.8, 'sine', bgmGain, 0.07);
                }
            }

            const chordIdx = Math.floor(barIdx / 2) % 4;
            const chord = chords[chordIdx];
            for (let b = 0; b < 4; b++) {
                chord.forEach(function(f) {
                    playNote(f / 2, t + b * beat, beat * 0.9, 'sine', bgmGain, 0.03);
                });
            }

            for (let b = 0; b < 4; b++) {
                playKick(t + b * beat);
                playHiHat(t + b * beat);
                playHiHat(t + b * beat + eighth);
                if (b === 1 || b === 3) playSnare(t + b * beat);
            }

            barIdx = (barIdx + 1) % 8;
            nextBar = t + beat * 4;
            setTimeout(scheduleBar, (beat * 4 * 1000) - 100);
        }

        function playKick(t) {
            var o = actx.createOscillator();
            var g = actx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(150, t);
            o.frequency.exponentialRampToValueAtTime(40, t + 0.1);
            g.gain.setValueAtTime(0.25, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
            o.connect(g);
            g.connect(bgmGain);
            o.start(t);
            o.stop(t + 0.15);
        }

        function playSnare(t) {
            var buf = actx.createBuffer(1, actx.sampleRate * 0.1, actx.sampleRate);
            var d = buf.getChannelData(0);
            for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1);
            var n = actx.createBufferSource();
            var g = actx.createGain();
            n.buffer = buf;
            g.gain.setValueAtTime(0.12, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
            var flt = actx.createBiquadFilter();
            flt.type = 'highpass';
            flt.frequency.value = 1000;
            n.connect(flt);
            flt.connect(g);
            g.connect(bgmGain);
            n.start(t);
            n.stop(t + 0.1);
            var o = actx.createOscillator();
            var g2 = actx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(200, t);
            o.frequency.exponentialRampToValueAtTime(120, t + 0.05);
            g2.gain.setValueAtTime(0.12, t);
            g2.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
            o.connect(g2);
            g2.connect(bgmGain);
            o.start(t);
            o.stop(t + 0.08);
        }

        function playHiHat(t) {
            var buf = actx.createBuffer(1, actx.sampleRate * 0.04, actx.sampleRate);
            var d = buf.getChannelData(0);
            for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
            var n = actx.createBufferSource();
            var g = actx.createGain();
            n.buffer = buf;
            g.gain.setValueAtTime(0.06, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
            var flt = actx.createBiquadFilter();
            flt.type = 'highpass';
            flt.frequency.value = 6000;
            n.connect(flt);
            flt.connect(g);
            g.connect(bgmGain);
            n.start(t);
            n.stop(t + 0.05);
        }

        scheduleBar();
    }

    function stopBGM() {
        bgmPlaying = false;
    }

    function playNote(freq, st, dur, type, dest, vol) {
        if (!actx) return;
        var o = actx.createOscillator();
        var g = actx.createGain();
        o.type = type || 'sine';
        o.frequency.value = freq;
        g.gain.setValueAtTime(vol || 0.1, st);
        g.gain.exponentialRampToValueAtTime(0.001, st + dur);
        o.connect(g);
        g.connect(dest || masterGain);
        o.start(st);
        o.stop(st + dur + 0.05);
    }

    function shoot() {
        if (!actx || muted) return;
        resume();
        var now = actx.currentTime;
        var o = actx.createOscillator();
        var g = actx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(800, now);
        o.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
        o.frequency.exponentialRampToValueAtTime(600, now + 0.15);
        g.gain.setValueAtTime(0.15, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        o.connect(g);
        g.connect(masterGain);
        o.start(now);
        o.stop(now + 0.2);
        var o2 = actx.createOscillator();
        var g2 = actx.createGain();
        o2.type = 'sine';
        o2.frequency.setValueAtTime(1400, now);
        o2.frequency.exponentialRampToValueAtTime(1800, now + 0.1);
        g2.gain.setValueAtTime(0.06, now);
        g2.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        o2.connect(g2);
        g2.connect(masterGain);
        o2.start(now);
        o2.stop(now + 0.15);
    }

    function trap() {
        if (!actx || muted) return;
        resume();
        var now = actx.currentTime;
        for (var i = 0; i < 3; i++) {
            var o = actx.createOscillator();
            var g = actx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(1000 + i * 200, now + i * 0.06);
            o.frequency.exponentialRampToValueAtTime(1500 + i * 200, now + i * 0.06 + 0.1);
            g.gain.setValueAtTime(0.12, now + i * 0.06);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.15);
            o.connect(g);
            g.connect(masterGain);
            o.start(now + i * 0.06);
            o.stop(now + i * 0.06 + 0.2);
        }
    }

    function kill() {
        if (!actx || muted) return;
        resume();
        var now = actx.currentTime;
        var o = actx.createOscillator();
        var g = actx.createGain();
        o.type = 'square';
        o.frequency.setValueAtTime(400, now);
        o.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
        g.gain.setValueAtTime(0.1, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        o.connect(g);
        g.connect(masterGain);
        o.start(now);
        o.stop(now + 0.25);
        var buf = actx.createBuffer(1, actx.sampleRate * 0.15, actx.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
        var n = actx.createBufferSource();
        var ng = actx.createGain();
        n.buffer = buf;
        ng.gain.setValueAtTime(0.15, now + 0.05);
        ng.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        n.connect(ng);
        ng.connect(masterGain);
        n.start(now + 0.05);
        n.stop(now + 0.25);
    }

    function hit() {
        if (!actx || muted) return;
        resume();
        var now = actx.currentTime;
        var o = actx.createOscillator();
        var g = actx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(200, now);
        o.frequency.exponentialRampToValueAtTime(80, now + 0.2);
        g.gain.setValueAtTime(0.2, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        o.connect(g);
        g.connect(masterGain);
        o.start(now);
        o.stop(now + 0.3);
    }

    function collect() {
        if (!actx || muted) return;
        resume();
        var now = actx.currentTime;
        [880, 1100, 1320].forEach(function(f, i) {
            var o = actx.createOscillator();
            var g = actx.createGain();
            o.type = 'sine';
            o.frequency.value = f;
            g.gain.setValueAtTime(0.1, now + i * 0.07);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.15);
            o.connect(g);
            g.connect(masterGain);
            o.start(now + i * 0.07);
            o.stop(now + i * 0.07 + 0.2);
        });
    }

    function powerup() {
        if (!actx || muted) return;
        resume();
        var now = actx.currentTime;
        [660, 880, 1100, 1320, 1760].forEach(function(f, i) {
            var o = actx.createOscillator();
            var g = actx.createGain();
            o.type = 'triangle';
            o.frequency.value = f;
            g.gain.setValueAtTime(0.08, now + i * 0.05);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.2);
            o.connect(g);
            g.connect(masterGain);
            o.start(now + i * 0.05);
            o.stop(now + i * 0.05 + 0.25);
        });
    }

    function gameOverSnd() {
        if (!actx || muted) return;
        resume();
        var now = actx.currentTime;
        [440, 370, 311, 261].forEach(function(f, i) {
            var o = actx.createOscillator();
            var g = actx.createGain();
            o.type = 'sine';
            o.frequency.value = f;
            g.gain.setValueAtTime(0.15, now + i * 0.25);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.25 + 0.35);
            o.connect(g);
            g.connect(masterGain);
            o.start(now + i * 0.25);
            o.stop(now + i * 0.25 + 0.4);
        });
    }

    function waveClear() {
        if (!actx || muted) return;
        resume();
        var now = actx.currentTime;
        [523, 659, 784, 1047, 1318].forEach(function(f, i) {
            var o = actx.createOscillator();
            var g = actx.createGain();
            o.type = 'triangle';
            o.frequency.value = f;
            g.gain.setValueAtTime(0.1, now + i * 0.1);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.3);
            o.connect(g);
            g.connect(masterGain);
            o.start(now + i * 0.1);
            o.stop(now + i * 0.1 + 0.35);
        });
    }

    function toggleMuteFn() {
        muted = !muted;
        if (bgmGain) bgmGain.gain.value = muted ? 0 : 0.35;
        return muted;
    }

    return {
        init: init,
        resume: resume,
        startBGM: startBGM,
        stopBGM: stopBGM,
        shoot: shoot,
        trap: trap,
        kill: kill,
        hit: hit,
        collect: collect,
        powerup: powerup,
        gameOverSnd: gameOverSnd,
        waveClear: waveClear,
        toggleMute: toggleMuteFn
    };
})();

// ===== 关卡定义 =====
var LEVELS = [
    { num:1,  type:'kill',     goal:10,  label:'消灭 10 只蜜蜂',  beeTypes:['normal'],     beeInterval:1400, beesPerSpawn:1 },
    { num:2,  type:'kill',     goal:18,  label:'消灭 18 只蜜蜂',  beeTypes:['normal'],     beeInterval:1200, beesPerSpawn:1 },
    { num:3,  type:'kill',     goal:25,  label:'消灭 25 只蜜蜂',  beeTypes:['normal','fast'], beeInterval:1000, beesPerSpawn:1 },
    { num:4,  type:'survive',  goal:45,  label:'生存 45 秒',      beeTypes:['normal','fast'], beeInterval:900,  beesPerSpawn:1 },
    { num:5,  type:'kill',     goal:35,  label:'消灭 35 只蜜蜂',  beeTypes:['normal','fast','tank'], beeInterval:850, beesPerSpawn:1 },
    { num:6,  type:'survive',  goal:60,  label:'生存 60 秒',      beeTypes:['normal','fast','tank'], beeInterval:750, beesPerSpawn:2 },
    { num:7,  type:'boss',     goal:1,   label:'击败守卫蜜蜂!',   beeTypes:['normal','fast'], beeInterval:800, beesPerSpawn:1,
        boss:{ name:'守卫蜜蜂', hp:15, size:1.8, speed:1.5, stingerInterval:1800, stingerDamage:1, color:'#C0392B', trapDuration:8000 }},
    { num:8,  type:'kill',     goal:50,  label:'消灭 50 只蜜蜂',  beeTypes:['normal','fast','tank'], beeInterval:650, beesPerSpawn:2 },

const canvas = document.getElementById('gameCanvas');

const LOGIC_W = 900, LOGIC_H = 650;
const W = canvas.width;
const H = canvas.height;

// 自适应缩放：canvas CSS尺寸 / 逻辑尺寸
function getScale() {
    var r = canvas.getBoundingClientRect();
    return { sx: r.width / LOGIC_W, sy: r.height / LOGIC_H };
}
function toLogicX(screenX) {
    var r = canvas.getBoundingClientRect();
    var s = screenX - r.left;
    return s / r.width * LOGIC_W;
}
function toLogicY(screenY) {
    var r = canvas.getBoundingClientRect();
    var s = screenY - r.top;
    return s / r.height * LOGIC_H;
}

// 窗口resize时调整canvas显示尺寸（保持比例）
function resizeCanvas() {
    var cw = window.innerWidth, ch = window.innerHeight;
    var ratio = LOGIC_W / LOGIC_H;
    var w, h;
    if (cw / ch > ratio) {
        h = ch; w = h * ratio;
    } else {
        w = cw; h = w / ratio;
    }
    canvas.style.width = Math.floor(w) + 'px';
    canvas.style.height = Math.floor(h) + 'px';
}
window.addEventListener('resize', resizeCanvas);

function drawLeg(x, y, dir) {

    ctx_c.ellipse(0, 0, 7, 10, 0.1, 0, Math.PI * 2);
    ctx_c.fillStyle = '#B85A1F';
    ctx_c.fill();
    ctx_c.fillStyle = '#5C2608';
    for (var i = -1; i <= 1; i++) {
        ctx_c.beginPath();
        ctx_c.ellipse(i * 3, 9, 2, 3, 0, 0, Math.PI * 2);

    }

}

function drawEar(x, y, rot) {
    ctx_c.save();
    ctx_c.translate(x, y);
    ctx_c.rotate(rot);
    ctx_c.beginPath();
    ctx_c.ellipse(0, 0, 6, 9, 0, 0, Math.PI * 2);
    ctx_c.fillStyle = '#C46A2B';
    ctx_c.fill();
    ctx_c.beginPath();
    ctx_c.ellipse(0, 1, 3, 6, 0, 0, Math.PI * 2);

}

function drawEye(x, y) {
    ctx_c.beginPath();
    ctx_c.ellipse(x, y, 7, 8, 0, 0, Math.PI * 2);
    ctx_c.fillStyle = 'white';
    ctx_c.fill();
    var lx = Math.cos(chipmunk.angle) * 2;
    var ly = Math.sin(chipmunk.angle) * 2;
    ctx_c.beginPath();
    ctx_c.arc(x + lx, y + ly, 4.5, 0, Math.PI * 2);
    ctx_c.fillStyle = '#2D1810';
    ctx_c.fill();
    ctx_c.beginPath();
    ctx_c.arc(x + lx - 1.5, y + ly - 2, 2, 0, Math.PI * 2);
    ctx_c.fillStyle = 'white';
    ctx_c.fill();
    ctx_c.beginPath();
    ctx_c.arc(x + lx + 1, y + ly + 1, 1, 0, Math.PI * 2);
    ctx_c.fillStyle = 'rgba(255,255,255,0.6)';
    ctx_c.fill();
}

function roundRect(x, y, w, h, r) {
    ctx_c.beginPath();
    ctx_c.moveTo(x + r, y);
    ctx_c.lineTo(x + w - r, y);
    ctx_c.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx_c.lineTo(x + w, y + h - r);
    ctx_c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx_c.lineTo(x + r, y + h);
    ctx_c.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx_c.lineTo(x, y + r);
    ctx_c.quadraticCurveTo(x, y, x + r, y);
    ctx_c.closePath();
}

// ===== 泡泡类 =====
function Bubble(x, y, vx, vy, isPower) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.r = isPower ? 22 : 16;
    this.life = 120;
    this.hue = 185 + Math.random() * 50;
    this.sat = 70 + Math.random() * 20;
    this.isPower = isPower;
    this.wobble = Math.random() * Math.PI * 2;
    this.trail = [];
}
Bubble.prototype.update = function() {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 5) this.trail.shift();
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.03;
    this.life -= 0.4;
    this.wobble += 0.15;
    if (this.x < this.r) { this.x = this.r; this.vx *= -0.7; }
    if (this.x > W - this.r) { this.x = W - this.r; this.vx *= -0.7; }
    if (this.y < this.r) { this.y = this.r; this.vy *= -0.7; }
};
Bubble.prototype.draw = function() {
    for (var i = 0; i < this.trail.length; i++) {
        var t = this.trail[i];
        ctx_c.beginPath();
        ctx_c.arc(t.x, t.y, this.r * (i / this.trail.length) * 0.6, 0, Math.PI * 2);
        ctx_c.fillStyle = 'hsla(' + this.hue + ',' + this.sat + '%,75%,' + ((i / this.trail.length) * 0.2) + ')';
        ctx_c.fill();
    }
    ctx_c.save();
    var wr = this.r + Math.sin(this.wobble) * 1.5;
    if (this.isPower) {
        ctx_c.shadowColor = 'hsl(' + this.hue + ',100%,60%)';
        ctx_c.shadowBlur = 20;
    }
    var grad = ctx_c.createRadialGradient(this.x - wr * 0.3, this.y - wr * 0.3, 0, this.x, this.y, wr);
    grad.addColorStop(0, 'hsla(' + this.hue + ',' + this.sat + '%,95%,0.95)');
    grad.addColorStop(0.4, 'hsla(' + this.hue + ',' + this.sat + '%,75%,0.8)');
    grad.addColorStop(0.8, 'hsla(' + this.hue + ',' + this.sat + '%,55%,0.5)');
    grad.addColorStop(1, 'hsla(' + this.hue + ',' + this.sat + '%,45%,0.2)');
    ctx_c.beginPath();
    ctx_c.arc(this.x, this.y, wr, 0, Math.PI * 2);
    ctx_c.fillStyle = grad;
    ctx_c.fill();
    ctx_c.beginPath();
    ctx_c.ellipse(this.x - wr * 0.35, this.y - wr * 0.35, wr * 0.3, wr * 0.2, -0.5, 0, Math.PI * 2);
    ctx_c.fillStyle = 'rgba(255,255,255,0.85)';
    ctx_c.fill();
    ctx_c.beginPath();
    ctx_c.arc(this.x - wr * 0.15, this.y - wr * 0.5, wr * 0.1, 0, Math.PI * 2);
    ctx_c.fillStyle = 'rgba(255,255,255,0.7)';
    ctx_c.fill();
    ctx_c.beginPath();
    ctx_c.ellipse(this.x + wr * 0.2, this.y + wr * 0.35, wr * 0.2, wr * 0.1, 0.3, 0, Math.PI * 2);
    ctx_c.fillStyle = 'rgba(255,255,255,0.3)';
    ctx_c.fill();
    if (this.isPower) {
        ctx_c.beginPath();
        ctx_c.arc(this.x, this.y, wr * 0.5, 0, Math.PI * 2);
        ctx_c.strokeStyle = 'hsla(' + (this.hue + 60) + ',100%,70%,0.6)';
        ctx_c.lineWidth = 2;
        ctx_c.setLineDash([4, 4]);
        ctx_c.stroke();
        ctx_c.setLineDash([]);
    }
    ctx_c.restore();
};

// ===== 蜜蜂类 =====
function Bee(type) {
    this.type = type || 'normal';
    this.x = Math.random() * W;
    this.y = -40;
    if (this.type === 'fast') {
        this.speed = 3.5 + Math.random() * 2;
        this.hp = 1;
        this.size = 0.8;
        this.color = '#FF8C00';
        this.stingerCD = 1200 + Math.random() * 800;
    } else if (this.type === 'tank') {
        this.speed = 1.2 + Math.random();
        this.hp = 2;
        this.size = 1.4;
        this.color = '#8B0000';
        this.stingerCD = 2500 + Math.random() * 1000;
    } else {
        this.speed = 1.8 + Math.random() * 1.8;
        this.hp = 1;
        this.size = 1;
        this.color = '#FFD700';
        this.stingerCD = 2000 + Math.random() * 1000;
    }
    this.maxHP = this.hp;
    this.width = 36 * this.size;
    this.height = 28 * this.size;
    this.wingAngle = Math.random() * Math.PI * 2;
    this.bodyAngle = 0;
    this.trapped = false;
    this.trapTime = 0;
    this.trapDuration = 5000;
    this.entryAnim = 1;
    this.zigzag = Math.random() * Math.PI * 2;
    this.baseSpeed = this.speed;
    this.stingerTimer = Math.random() * this.stingerCD;
}
Bee.prototype.update = function() {
    if (this.entryAnim > 0) this.entryAnim -= 0.05;
    if (!this.trapped) {
        var dx = chipmunk.x - this.x;
        var dy = chipmunk.y - this.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        this.zigzag += 0.04;
        var zx = Math.sin(this.zigzag) * (this.type === 'tank' ? 0 : 1.2);
        var zy = Math.cos(this.zigzag * 1.3) * (this.type === 'tank' ? 0 : 0.8);
        if (dist > 8) {
            this.x += (dx / dist) * this.speed + zx;
            this.y += (dy / dist) * this.speed + zy;
        }
        this.bodyAngle = Math.atan2(dy, dx);
        this.wingAngle += this.type === 'fast' ? 0.8 : 0.5;
        // 发射蜂刺
        this.stingerTimer -= 16.67;
        if (this.stingerTimer <= 0 && dist < 400) {
            this.stingerTimer = this.stingerCD;
            var sa = Math.atan2(dy, dx);
            var sv = 4 + this.speed * 0.3;
            stingers.push(new Stinger(this.x, this.y, Math.cos(sa) * sv, Math.sin(sa) * sv, this.type === 'tank' ? 2 : 1, this));
        }
    } else {
        this.trapTime += 16.67;
        this.x += Math.sin(Date.now() / 250) * 0.6;
        this.y += Math.cos(Date.now() / 200) * 0.4 + 0.3;
        this.wingAngle += 0.15;
    }
};
Bee.prototype.draw = function() {
    ctx_c.save();
    ctx_c.translate(this.x, this.y);
    var s = this.size * (this.entryAnim < 1 ? 0.5 + this.entryAnim * 0.5 : 1);
    ctx_c.scale(s, s);

    if (this.trapped) {
        var prog = this.trapTime / this.trapDuration;
        var pulse = 1 + Math.sin(Date.now() / 150) * 0.08;
        ctx_c.beginPath();
        var bGrad = ctx_c.createRadialGradient(-6, -6, 0, 0, 0, 34 * pulse);
        bGrad.addColorStop(0, 'hsla(195,90%,92%,0.85)');
        bGrad.addColorStop(0.5, 'hsla(195,80%,72%,0.6)');
        bGrad.addColorStop(1, 'hsla(195,70%,55%,0.25)');
        ctx_c.arc(0, 0, 34 * pulse, 0, Math.PI * 2);
        ctx_c.fillStyle = bGrad;
        ctx_c.fill();
        ctx_c.beginPath();
        ctx_c.arc(0, 0, 38, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - prog));
        ctx_c.strokeStyle = prog > 0.7 ? '#FF4444' : '#44BBFF';
        ctx_c.lineWidth = 3;
        ctx_c.lineCap = 'round';
        ctx_c.stroke();
        var rem = Math.max(0, (this.trapDuration - this.trapTime) / 1000);
        ctx_c.font = 'bold 16px Arial';
        ctx_c.textAlign = 'center';
        ctx_c.textBaseline = 'middle';
        ctx_c.fillStyle = rem <= 1.5 ? '#FF3333' : '#FFFFFF';
        ctx_c.strokeStyle = '#000';
        ctx_c.lineWidth = 3;
        ctx_c.strokeText(rem.toFixed(1), 0, 2);
        ctx_c.fillText(rem.toFixed(1), 0, 2);
    }

    var bodyRot = this.trapped ? Math.sin(Date.now() / 300) * 0.15 : 0;
    ctx_c.rotate(bodyRot);

    // 翅膀
    drawWings.call(this, true);

    // 腹部
    ctx_c.beginPath();
    ctx_c.ellipse(0, 2, 18, 14, 0, 0, Math.PI * 2);
    var aGrad = ctx_c.createRadialGradient(-4, -2, 0, 0, 2, 18);
    aGrad.addColorStop(0, this.color);
    aGrad.addColorStop(1, this.type === 'tank' ? '#4A0000' : this.type === 'fast' ? '#CC5500' : '#B8860B');
    ctx_c.fillStyle = aGrad;
    ctx_c.fill();

    // 条纹
    ctx_c.fillStyle = this.type === 'tank' ? '#2A0000' : '#222';
    for (var i = -10; i <= 10; i += 7) {
        ctx_c.fillRect(i - 2, -11, 4, 22);
    }

    // 头部
    ctx_c.beginPath();
    ctx_c.arc(0, -14, 11, 0, Math.PI * 2);
    var hGrad = ctx_c.createRadialGradient(-2, -17, 0, 0, -14, 11);
    hGrad.addColorStop(0, this.color);
    hGrad.addColorStop(1, this.type === 'tank' ? '#4A0000' : this.type === 'fast' ? '#CC5500' : '#996600');
    ctx_c.fillStyle = hGrad;
    ctx_c.fill();

    // 眼睛
    ctx_c.fillStyle = 'white';
    ctx_c.beginPath();
    ctx_c.ellipse(-5, -15, 5, 6, -0.2, 0, Math.PI * 2);
    ctx_c.ellipse(5, -15, 5, 6, 0.2, 0, Math.PI * 2);
    ctx_c.fill();

    var lookDir = this.trapped ? 0 : Math.atan2(chipmunk.y - this.y, chipmunk.x - this.x);
    var lx = Math.cos(lookDir) * 1.5;
    var ly = Math.sin(lookDir) * 1.5;
    ctx_c.fillStyle = '#111';
    ctx_c.beginPath();
    ctx_c.arc(-5 + lx, -15 + ly, 2.5, 0, Math.PI * 2);
    ctx_c.arc(5 + lx, -15 + ly, 2.5, 0, Math.PI * 2);
    ctx_c.fill();

    ctx_c.fillStyle = 'white';
    ctx_c.beginPath();
    ctx_c.arc(-6 + lx, -16 + ly, 1.2, 0, Math.PI * 2);
    ctx_c.arc(4 + lx, -16 + ly, 1.2, 0, Math.PI * 2);
    ctx_c.fill();

    // 触角
    ctx_c.strokeStyle = '#222';
    ctx_c.lineWidth = 1.8;
    ctx_c.lineCap = 'round';
    var aw = Math.sin(Date.now() / 100) * 0.15;
    ctx_c.beginPath();
    ctx_c.moveTo(-5, -23);
    ctx_c.quadraticCurveTo(-10 + aw * 5, -33, -8, -38);
    ctx_c.moveTo(5, -23);
    ctx_c.quadraticCurveTo(10 - aw * 5, -33, 8, -38);
    ctx_c.stroke();

    ctx_c.fillStyle = '#222';
    ctx_c.beginPath();
    ctx_c.arc(-8, -38, 2.5, 0, Math.PI * 2);
    ctx_c.arc(8, -38, 2.5, 0, Math.PI * 2);
    ctx_c.fill();

    // 口器(刺)
    if (!this.trapped) {
        ctx_c.strokeStyle = '#333';
        ctx_c.lineWidth = 2;
        ctx_c.beginPath();
        ctx_c.moveTo(0, 8);
        ctx_c.lineTo(0, 18);
        ctx_c.stroke();
    }

    // HP条
    if (this.maxHP > 1) {
        var hw = 30;
        var hx = -hw / 2;
        var hy = -30;
        ctx_c.fillStyle = 'rgba(0,0,0,0.4)';
        ctx_c.fillRect(hx, hy, hw, 5);
        ctx_c.fillStyle = this.hp / this.maxHP > 0.5 ? '#44BB44' : this.hp / this.maxHP > 0.25 ? '#FFAA00' : '#FF4444';
        ctx_c.fillRect(hx, hy, hw * (this.hp / this.maxHP), 5);
    }

    // 翅膀(上层)
    drawWings.call(this, false);

    ctx_c.strokeStyle = this.type === 'tank' ? '#4A0000' : '#666';

};

// ===== Boss蜜蜂类 =====
function BossBee(bossData) {
    Bee.call(this, 'tank');
    this.name = bossData.name;
    this.hp = bossData.hp;
    this.maxHP = bossData.hp;
    this.size = bossData.size;
    this.speed = bossData.speed;
    this.stingerCD = bossData.stingerInterval;
    this.stingerDamage = bossData.stingerDamage;
    this.color = bossData.color;
    this.trapDuration = bossData.trapDuration;
    this.x = W / 2;
    this.y = -60;
    this.phase = 0;
    this.phaseTimer = 0;
    this.specialCD = 5000;
    this.specialTimer = 2000;
}
BossBee.prototype = Object.create(Bee.prototype);
BossBee.prototype.constructor = BossBee;

BossBee.prototype.update = function() {
    if (this.trapped) {
        Bee.prototype.update.call(this);
        return;
    }
    this.phaseTimer += 16.67;
    var t = Date.now() / 1000;
    var dx = chipmunk.x - this.x;
    var dy = chipmunk.y - this.y;
    this.x = W / 2 + Math.cos(t * 0.8) * 200;
    this.y = H * 0.25 + Math.sin(t * 0.6) * 120;
    this.bodyAngle = Math.atan2(dy, dx);
    this.wingAngle += 0.6;

    this.stingerTimer -= 16.67;
    if (this.stingerTimer <= 0) {
        this.stingerTimer = this.stingerCD;
        var sa = Math.atan2(dy, dx);
        for (var i = -1; i <= 1; i++) {
            var a = sa + i * 0.15;
            stingers.push(new Stinger(this.x, this.y, Math.cos(a) * 5, Math.sin(a) * 5, this.stingerDamage, this));
        }
    }
    this.specialTimer -= 16.67;
    if (this.specialTimer <= 0) {
        this.specialTimer = this.specialCD;
        var sa2 = Math.atan2(chipmunk.y - this.y, chipmunk.x - this.x);
        for (var j = -3; j <= 3; j++) {
            var a2 = sa2 + j * 0.2;
            stingers.push(new Stinger(this.x, this.y, Math.cos(a2) * 4.5, Math.sin(a2) * 4.5, this.stingerDamage + 1, this));
        }
    }
};

BossBee.prototype.draw = function() {
    ctx_c.save();
    ctx_c.translate(this.x, this.y);
    var pulse = 1 + Math.sin(Date.now() / 200) * 0.05;
    ctx_c.shadowColor = this.color;
    ctx_c.shadowBlur = 30;
    ctx_c.beginPath();
    ctx_c.arc(0, 0, 60 * pulse, 0, Math.PI * 2);
    var r = parseInt(this.color.slice(1, 3), 16);
    var g = parseInt(this.color.slice(3, 5), 16);
    var b = parseInt(this.color.slice(5, 7), 16);
    ctx_c.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',0.08)';
    ctx_c.fill();
    ctx_c.shadowBlur = 0;

    var s = this.size;
    ctx_c.scale(s, s);

    if (this.trapped) {
        var prog = this.trapTime / this.trapDuration;
        var pulse2 = 1 + Math.sin(Date.now() / 150) * 0.08;
        ctx_c.beginPath();
        var bGrad = ctx_c.createRadialGradient(-6, -6, 0, 0, 0, 50 * pulse2);
        bGrad.addColorStop(0, 'hsla(195,90%,92%,0.9)');
        bGrad.addColorStop(0.5, 'hsla(195,80%,72%,0.7)');
        bGrad.addColorStop(1, 'hsla(195,70%,55%,0.3)');
        ctx_c.arc(0, 0, 50 * pulse2, 0, Math.PI * 2);
        ctx_c.fillStyle = bGrad;
        ctx_c.fill();
        ctx_c.beginPath();
        ctx_c.arc(0, 0, 54, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - prog));
        ctx_c.strokeStyle = prog > 0.7 ? '#FF4444' : '#44BBFF';
        ctx_c.lineWidth = 4;
        ctx_c.lineCap = 'round';
        ctx_c.stroke();
        var rem = Math.max(0, (this.trapDuration - this.trapTime) / 1000);
        ctx_c.font = 'bold 24px Arial';
        ctx_c.textAlign = 'center';
        ctx_c.textBaseline = 'middle';
        ctx_c.fillStyle = rem <= 1.5 ? '#FF3333' : '#FFFFFF';
        ctx_c.strokeStyle = '#000';
        ctx_c.lineWidth = 4;
        ctx_c.strokeText(rem.toFixed(1), 0, 2);
        ctx_c.fillText(rem.toFixed(1), 0, 2);
    }

    // 身体
    drawBossBody.call(this);
    // 翅膀
    drawBossWings.call(this);

    // HP条
    var hw = 80;
    var hx = -hw / 2;
    var hy = -55;
    ctx_c.fillStyle = 'rgba(0,0,0,0.6)';
    ctx_c.fillRect(hx, hy, hw, 8);
    var hpRatio = this.hp / this.maxHP;
    var hpGrad = ctx_c.createLinearGradient(hx, 0, hx + hw, 0);
    hpGrad.addColorStop(0, '#FF0000');
    hpGrad.addColorStop(1, '#44FF44');
    ctx_c.fillStyle = hpGrad;
    ctx_c.fillRect(hx, hy, hw * hpRatio, 8);
    ctx_c.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx_c.lineWidth = 1;
    ctx_c.strokeRect(hx, hy, hw, 8);

    // 名字
    ctx_c.font = 'bold 14px Arial';
    ctx_c.fillStyle = '#FFF';
    ctx_c.textAlign = 'center';
    ctx_c.strokeStyle = '#000';
    ctx_c.lineWidth = 3;
    ctx_c.strokeText(this.name, 0, -62);
    ctx_c.fillText(this.name, 0, -62);

    ctx_c.restore();
};

function drawBossBody() {
    var bodyGrad = ctx_c.createRadialGradient(-10, -10, 0, 0, 5, 50);

    ctx_c.fillStyle = this.color;

}

function drawBossWings() {
    var wa = Math.sin(this.wingAngle) * 15;
    ctx_c.fillStyle = 'rgba(200,220,255,0.5)';
    ctx_c.strokeStyle = 'rgba(150,180,220,0.4)';

}

// ===== 蜂刺类 =====
function Stinger(x, y, vx, vy, damage, owner) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.damage = damage || 1;
    this.owner = owner;
    this.life = 200;
    this.trail = [];
    this.alive = true;
}
Stinger.prototype.update = function() {
    if (!this.alive) return;
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 6) this.trail.shift();
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.alive = false;
    var dx = this.x - chipmunk.x;
    var dy = this.y - chipmunk.y;
    if (Math.sqrt(dx * dx + dy * dy) < 35) {
        this.alive = false;
        G.lives -= this.damage;
        updateLives();
        AudioSys.hit();
        for (var k = 0; k < 8; k++) particles.push(new Particle(chipmunk.x, chipmunk.y, '#FF4444'));
        showFloatScore(chipmunk.x, chipmunk.y - 30, '-' + this.damage + ' ❤️', '#FF4444', 18);
        if (G.lives <= 0) endGame(false);
    }
};
Stinger.prototype.draw = function() {
    if (!this.alive) return;
    ctx_c.save();
    ctx_c.translate(this.x, this.y);
    for (var i = 0; i < this.trail.length; i++) {
        var t = this.trail[i];
        ctx_c.beginPath();
        ctx_c.arc(t.x, t.y, 3 * (i / this.trail.length), 0, Math.PI * 2);
        ctx_c.fillStyle = 'rgba(255,' + (this.damage > 1 ? '50' : '200') + ',0,' + (i / this.trail.length) + ')';
        ctx_c.fill();
    }
    ctx_c.rotate(Math.atan2(this.vy, this.vx));
    ctx_c.fillStyle = this.damage > 1 ? '#FF4444' : '#FFAA00';
    ctx_c.shadowColor = this.damage > 1 ? '#FF0000' : '#FF8800';
    ctx_c.shadowBlur = 8;
    ctx_c.beginPath();
    ctx_c.moveTo(12, 0);
    ctx_c.lineTo(-4, -4);
    ctx_c.lineTo(-2, 0);
    ctx_c.lineTo(-4, 4);
    ctx_c.closePath();
    ctx_c.fill();
    ctx_c.fillStyle = 'rgba(255,255,200,0.6)';
    ctx_c.beginPath();
    ctx_c.ellipse(6, -1, 3, 1.5, 0.2, 0, Math.PI * 2);
    ctx_c.fill();
    ctx_c.restore();
};

// ===== 粒子/星星/能量道具 =====
function Particle(x, y, color, type) {
    this.x = x;
    this.y = y;
    this.type = type || 'circle';
    var a = Math.random() * Math.PI * 2;
    var s = Math.random() * 6 + 2;
    this.vx = Math.cos(a) * s;
    this.vy = Math.sin(a) * s;
    this.life = 1;
    this.decay = 0.015 + Math.random() * 0.02;
    this.color = color;
    this.size = type === 'star' ? Math.random() * 10 + 6 : Math.random() * 7 + 3;
    this.rot = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.3;
}
Particle.prototype.update = function() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.12;
    this.vx *= 0.98;
    this.life -= this.decay;
    this.rot += this.rotSpeed;
};
Particle.prototype.draw = function() {
    ctx_c.save();
    ctx_c.translate(this.x, this.y);
    ctx_c.rotate(this.rot);
    ctx_c.globalAlpha = this.life;
    ctx_c.fillStyle = this.color;
    if (this.type === 'star') {
        var r = 0;
        var step = Math.PI / 5;
        ctx_c.beginPath();
        for (var i = 0; i < 10; i++) {
            var ra = i % 2 === 0 ? this.size : this.size * 0.5;
            var px = Math.cos(r) * ra;
            var py = Math.sin(r) * ra;
            if (i === 0) ctx_c.moveTo(px, py);
            else ctx_c.lineTo(px, py);
            r += step;
        }
        ctx_c.closePath();
        ctx_c.fill();
    } else if (this.type === 'heart') {
        ctx_c.beginPath();
        ctx_c.moveTo(0, this.size * 0.3);
        ctx_c.bezierCurveTo(-this.size * 0.5, -this.size * 0.3, -this.size * 0.5, this.size * 0.5, 0, this.size * 0.7);
        ctx_c.bezierCurveTo(this.size * 0.5, this.size * 0.5, this.size * 0.5, -this.size * 0.3, 0, this.size * 0.3);
        ctx_c.fill();
    } else {
        ctx_c.beginPath();
        ctx_c.arc(0, 0, this.size, 0, Math.PI * 2);
        ctx_c.fill();
    }
    ctx_c.restore();
};

function Star(x, y) {
    this.x = x;
    this.y = y;
    this.vy = -1.5;
    this.life = 1;
    this.rot = 0;
    this.scale = 1;
}
Star.prototype.update = function() {
    this.y += this.vy;
    this.vy *= 0.98;
    this.rot += 0.04;
    this.scale = 1 + Math.sin(Date.now() / 150) * 0.15;
};
Star.prototype.draw = function() {
    ctx_c.save();
    ctx_c.translate(this.x, this.y);
    ctx_c.rotate(this.rot);
    ctx_c.scale(this.scale, this.scale);
    ctx_c.shadowColor = '#FFD700';
    ctx_c.shadowBlur = 12;
    var r = 0;
    var step = Math.PI / 5;
    ctx_c.beginPath();
    for (var i = 0; i < 10; i++) {
        var ra = i % 2 === 0 ? 14 : 6;
        var px = Math.cos(r) * ra;
        var py = Math.sin(r) * ra;
        if (i === 0) ctx_c.moveTo(px, py);
        else ctx_c.lineTo(px, py);
        r += step;
    }
    ctx_c.closePath();
    var sGrad = ctx_c.createRadialGradient(0, 0, 0, 0, 0, 14);
    sGrad.addColorStop(0, '#FFFACD');
    sGrad.addColorStop(0.5, '#FFD700');
    sGrad.addColorStop(1, '#FFA500');
    ctx_c.fillStyle = sGrad;
    ctx_c.fill();
    ctx_c.restore();
};

// ===== 背景 =====
function initBgParticles() {
    bgParticles = [];
    for (var i = 0; i < 40; i++) {
        bgParticles.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 3 + 1,
            speedY: -Math.random() * 0.5 - 0.2,
            alpha: Math.random() * 0.5 + 0.2,
            twinkle: Math.random() * Math.PI * 2
        });
    }
}

function drawBackground(time) {
    var sGrad = ctx_c.createLinearGradient(0, 0, 0, H);
    sGrad.addColorStop(0, '#0F0C29');
    sGrad.addColorStop(0.3, '#302B63');
    sGrad.addColorStop(0.6, '#24243E');
    sGrad.addColorStop(1, '#1a1a3e');
    ctx_c.fillStyle = sGrad;
    ctx_c.fillRect(0, 0, W, H);

    bgParticles.forEach(function(p) {
        p.twinkle += 0.02;
        p.y += p.speedY;
        if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
        ctx_c.beginPath();
        ctx_c.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx_c.fillStyle = 'rgba(255,255,240,' + (p.alpha * (0.5 + Math.sin(p.twinkle) * 0.5)) + ')';
        ctx_c.fill();
    });

    // 月亮
    ctx_c.save();
    ctx_c.beginPath();
    ctx_c.arc(W - 100, 90, 45, 0, Math.PI * 2);
    var mGrad = ctx_c.createRadialGradient(W - 110, 80, 0, W - 100, 90, 45);
    mGrad.addColorStop(0, '#FFFDE7');
    mGrad.addColorStop(0.7, '#FFF9C4');
    mGrad.addColorStop(1, '#FFE082');
    ctx_c.fillStyle = mGrad;
    ctx_c.fill();
    ctx_c.globalCompositeOperation = 'destination-out';
    ctx_c.beginPath();
    ctx_c.arc(W - 82, 82, 38, 0, Math.PI * 2);
    ctx_c.fill();
    ctx_c.globalCompositeOperation = 'source-over';
    ctx_c.restore();

    // 山
    ctx_c.fillStyle = '#151530';
    ctx_c.beginPath();
    ctx_c.moveTo(0, H - 100);
    ctx_c.lineTo(80, H - 180);
    ctx_c.lineTo(160, H - 140);
    ctx_c.lineTo(280, H - 220);
    ctx_c.lineTo(400, H - 160);
    ctx_c.lineTo(520, H - 200);
    ctx_c.lineTo(650, H - 130);
    ctx_c.lineTo(750, H - 190);
    ctx_c.lineTo(W, H - 150);
    ctx_c.lineTo(W, H);
    ctx_c.lineTo(0, H);
    ctx_c.closePath();
    ctx_c.fill();

    ctx_c.fillStyle = '#1a1a38';
    ctx_c.beginPath();
    ctx_c.moveTo(0, H - 60);
    ctx_c.lineTo(120, H - 130);
    ctx_c.lineTo(250, H - 90);
    ctx_c.lineTo(380, H - 150);
    ctx_c.lineTo(500, H - 100);
    ctx_c.lineTo(680, H - 140);
    ctx_c.lineTo(W, H - 80);
    ctx_c.lineTo(W, H);
    ctx_c.lineTo(0, H);
    ctx_c.closePath();
    ctx_c.fill();

    // 地面
    var gGrad = ctx_c.createLinearGradient(0, H - 80, 0, H);
    gGrad.addColorStop(0, '#1B4332');
    gGrad.addColorStop(0.5, '#2D6A4F');
    gGrad.addColorStop(1, '#1B4332');
    ctx_c.fillStyle = gGrad;
    ctx_c.fillRect(0, H - 80, W, 80);

    // 草
    ctx_c.strokeStyle = '#40916C';
    ctx_c.lineWidth = 2;
    for (var i = 0; i < W; i += 15) {
        var gh = 8 + Math.sin(i * 0.1 + time * 0.001) * 4;
        ctx_c.beginPath();
        ctx_c.moveTo(i, H - 78);
        ctx_c.quadraticCurveTo(i + Math.sin(time * 0.002 + i) * 3, H - 78 - gh, i + Math.sin(time * 0.002 + i) * 5, H - 78 - gh - 5);
        ctx_c.stroke();
    }

    // 小花
    var fc = ['#FF6B9D', '#FFB3D9', '#E0BBE4', '#FFDAC1', '#B8E0D2'];
    for (var j = 0; j < 12; j++) {
        var fx = 40 + j * 72 + Math.sin(j * 2.5) * 20;
        var fy = H - 55 + Math.sin(j * 1.7) * 12;
        ctx_c.strokeStyle = '#52B788';
        ctx_c.lineWidth = 2;
        ctx_c.beginPath();
        ctx_c.moveTo(fx, H - 78);
        ctx_c.quadraticCurveTo(fx + Math.sin(time * 0.001 + j) * 3, fy + 10, fx, fy);
        ctx_c.stroke();
        ctx_c.fillStyle = fc[j % fc.length];
        for (var p = 0; p < 5; p++) {
            ctx_c.beginPath();
            var pa = (p / 5) * Math.PI * 2 + time * 0.0005;
            ctx_c.arc(fx + Math.cos(pa) * 6, fy + Math.sin(pa) * 6, 4.5, 0, Math.PI * 2);
            ctx_c.fill();
        }
        ctx_c.fillStyle = '#FFD700';
        ctx_c.beginPath();
        ctx_c.arc(fx, fy, 3.5, 0, Math.PI * 2);
        ctx_c.fill();
    }

    // 萤火虫
    for (var k = 0; k < 8; k++) {
        var ff = (time * 0.0008 + k * 2.5) % (Math.PI * 2);
        var ffx = 80 + k * 100 + Math.sin(ff + k) * 50;
        var ffy = H - 120 - Math.abs(Math.sin(ff * 1.5 + k)) * 80;
        var fb = 0.3 + Math.abs(Math.sin(ff * 3)) * 0.7;
        ctx_c.beginPath();
        ctx_c.arc(ffx, ffy, 2.5, 0, Math.PI * 2);
        ctx_c.fillStyle = 'rgba(200,255,150,' + fb + ')';
        ctx_c.shadowColor = '#CCFF88';
        ctx_c.shadowBlur = 10 * fb;
        ctx_c.fill();
        ctx_c.shadowBlur = 0;
    }
}

// ===== 发射泡泡 =====
function shootBubble(isPower) {
    var now = Date.now();
    var fireRate = G.combo >= 5 ? 100 : 140;
    if (now - lastShootTime < fireRate) return;
    lastShootTime = now;
    var speed = 13;
    var vx = Math.cos(chipmunk.angle) * speed;
    var vy = Math.sin(chipmunk.angle) * speed;
    var sx = chipmunk.x + Math.cos(chipmunk.angle) * 58;
    var sy = chipmunk.y + Math.sin(chipmunk.angle) * 58;
    bubbles.push(new Bubble(sx, sy, vx, vy, isPower));
    for (var i = 0; i < 5; i++) {
        particles.push(new Particle(sx, sy, 'hsla(' + (190 + Math.random() * 30) + ',80%,75%,1)'));
    }
    AudioSys.shoot();
}

// ===== 关卡逻辑 =====
function loadLevel(lv) {
    var def = LEVELS[lv - 1];
    if (!def) return false;
    G.level = lv;
    G.levelGoal = def.goal;
    G.levelGoalType = def.type;
    levelKillCount = 0;
    levelStartTime = Date.now();
    bees = [];
    bubbles = [];
    stingers = [];
    bossRef = null;
    lastBeeTime = 0;
    beesSpawnedThisLevel = 0;
    G.beeTypes = def.beeTypes;
    G.beeInterval = def.beeInterval;
    G.beesPerSpawn = def.beesPerSpawn;
    levelNumEl.textContent = lv;
    updateLevelGoalUI();
    bossHPBar.style.display = 'none';
    if (def.boss) {
        spawnBoss(def.boss);
    }
    showLevelBanner(lv, def.label);
    return true;
}

function spawnBee() {
    var def = LEVELS[G.level - 1];
    if (!def) return;
    if (G.levelGoalType === 'boss' || G.levelGoalType === 'finalboss') return;
    var now = Date.now();
    if (G.levelGoalType === 'kill' && beesSpawnedThisLevel >= def.goal) return;
    if (now - lastBeeTime > G.beeInterval && bees.length < 20) {
        lastBeeTime = now;
        for (var i = 0; i < G.beesPerSpawn; i++) {
            var type = G.beeTypes[Math.floor(Math.random() * G.beeTypes.length)];
            bees.push(new Bee(type));
        }
        beesSpawnedThisLevel++;
    }
}

function spawnBoss(bossData) {
    bossRef = new BossBee(bossData);
    bees.push(bossRef);
    bossHPBar.style.display = 'block';
}

function checkLevelComplete() {
    var def = LEVELS[G.level - 1];
    if (!def) return;
    if (def.type === 'kill') {
        console.log('[checkLevel] level=' + G.level + ' killCount=' + levelKillCount + '/' + def.goal + ' done=' + (levelKillCount >= def.goal));
    }
    var done = false;
    if (def.type === 'kill') {
        done = levelKillCount >= def.goal;
    } else if (def.type === 'survive') {
        done = ((Date.now() - levelStartTime) / 1000) >= def.goal;
    } else if (def.type === 'boss' || def.type === 'finalboss') {
        done = bossRef && bossRef.hp <= 0 && !bossRef.trapped;
    }
    if (done) {
        AudioSys.waveClear();
        if (G.level >= LEVELS.length) {
            showFloatScore(W / 2, H / 2, '🏆 恭喜通关!', '#FFD700', 36);
            setTimeout(function() { endGame(true); }, 2000);
            return;
        }
        loadLevel(G.level + 1);
    }
    if (def.type === 'survive') {
        var elapsed = (Date.now() - levelStartTime) / 1000;
        levelGoalEl.textContent = '⏱️ 目标: 生存 ' + def.goal + ' 秒 (' + Math.floor(elapsed) + '/' + def.goal + ')';
    }
}

function updateLevelGoalUI() {
    var def = LEVELS[G.level - 1];
    if (!def) return;
    if (def.type === 'kill') {
        levelGoalEl.textContent = '🎯 目标: ' + def.label + ' (' + levelKillCount + '/' + def.goal + ')';
    } else if (def.type === 'survive') {
        levelGoalEl.textContent = '⏱️ 目标: ' + def.label;
    } else if (def.type === 'boss' || def.type === 'finalboss') {
        levelGoalEl.textContent = '👾 目标: ' + def.label;
    }
}

// ===== 碰撞检测 =====
function checkCollisions() {
    // 泡泡 vs 蜜蜂
    for (var i = bubbles.length - 1; i >= 0; i--) {
        for (var j = bees.length - 1; j >= 0; j--) {
            if (bees[j].trapped) continue;
            var dx = bubbles[i].x - bees[j].x;
            var dy = bubbles[i].y - bees[j].y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < bubbles[i].r + 18 * bees[j].size) {
                bees[j].trapped = true;
                bees[j].trapTime = 0;
                if (bubbles[i].isPower) {
                    console.log('[collision] Power bubble killing bee ' + j);
                    killBee(j, true);
                } else {
                    AudioSys.trap();
                    bubbles.splice(i, 1);
                }
                break;
            }
        }
    }

    // 蜜蜂 vs 花栗鼠
    for (var i2 = bees.length - 1; i2 >= 0; i2--) {
        if (bees[i2].trapped) continue;
        var dx2 = bees[i2].x - chipmunk.x;
        var dy2 = bees[i2].y - chipmunk.y;
        var dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
        if (dist2 < 28 + 15 * bees[i2].size) {
            G.lives--;
            updateLives();
            AudioSys.hit();
            for (var k = 0; k < 15; k++) {
                particles.push(new Particle(chipmunk.x, chipmunk.y, '#FF4444'));
            }
            showFloatScore(chipmunk.x, chipmunk.y - 30, '-1 ❤️', '#FF4444', 20);
            bees.splice(i2, 1);
            G.combo = 0;
            comboEl.textContent = '';
            if (G.lives <= 0) endGame(false);
        }
    }

    // 星星收集
    for (var i3 = stars.length - 1; i3 >= 0; i3--) {
        var dx3 = stars[i3].x - chipmunk.x;
        var dy3 = stars[i3].y - chipmunk.y;
        if (Math.sqrt(dx3 * dx3 + dy3 * dy3) < 40) {
            G.score += 50;
            scoreEl.textContent = G.score;
            showFloatScore(stars[i3].x, stars[i3].y, '+50 ⭐', '#FFD700', 18);
            for (var k2 = 0; k2 < 8; k2++) {
                particles.push(new Particle(stars[i3].x, stars[i3].y, '#FFD700', 'star'));
            }
            AudioSys.collect();
            stars.splice(i3, 1);
        }
    }
}

function killBee(idx, instant) {
    var bee = bees[idx];
    console.log('[killBee] ENTER idx=' + idx + ' instant=' + instant + ' bee=' + (bee ? bee.constructor.name : 'null'));
    if (!bee) return;
    var bonus = instant ? 150 : 100;
    var comboBonus = G.combo * 15;
    var totalPts = bonus + comboBonus;
    G.score += totalPts;
    scoreEl.textContent = G.score;
    G.combo++;
    if (G.combo >= 2) {
        comboEl.textContent = '🔥 ' + G.combo + '连击! x' + (1 + G.combo * 0.5);
        comboEl.classList.add('pop');
        setTimeout(function() { comboEl.classList.remove('pop'); }, 300);
    }
    showFloatScore(bee.x, bee.y - 20, '+' + totalPts, G.combo >= 5 ? '#00FFAA' : '#FFD700', 22);
    var colors = ['#FFD700', '#FF8C00', '#FF6347', '#FFFACD'];
    for (var k3 = 0; k3 < 18; k3++) {
        var pType = Math.random() < 0.3 ? 'star' : (Math.random() < 0.2 ? 'heart' : 'circle');
        particles.push(new Particle(bee.x, bee.y, colors[Math.floor(Math.random() * colors.length)], pType));
    }
    if (Math.random() < 0.25) stars.push(new Star(bee.x, bee.y));
    if (G.combo > 0 && G.combo % 5 === 0) {
        powerups.push({ x: bee.x, y: bee.y, type: 'power', life: 300, vy: -0.5 });
    }
    // 关卡进度：kill类型关卡，非Boss蜜蜂死亡必计数
    if (G.levelGoalType === 'kill' && !(bee instanceof BossBee)) {
        levelKillCount++;
        console.log('[killBee] levelKillCount incremented to', levelKillCount, '/ goal:', LEVELS[G.level-1].goal);
    } else {
        console.log('[killBee] NOT counted. goalType=' + G.levelGoalType + ' isBoss=' + (bee instanceof BossBee));
    }
    updateLevelGoalUI();
    // Boss HP更新
    if (bee === bossRef) {
        bossHPFill.style.width = (bee.hp / Math.max(1, bee.maxHP) * 100) + '%';
        if (bee.hp <= 0) {
            bossHPBar.style.display = 'none';
            showFloatScore(bee.x, bee.y, '💥 Boss击败!', '#FF4444', 30);
        }
    }
    bees.splice(idx, 1);
    AudioSys.kill();
}

function updateTrappedBees() {
    for (var i = bees.length - 1; i >= 0; i--) {
        if (bees[i] && bees[i].trapped) {
            console.log('[updateTrapped] bee ' + i + ' trapped=' + bees[i].trapped + ' trapTime=' + bees[i].trapTime + '/' + bees[i].trapDuration);
        }
        if (bees[i].trapped && bees[i].trapTime >= bees[i].trapDuration) {
            if (bees[i] === bossRef) {
                bossRef.hp -= 1;
                bossRef.trapped = false;
                bossRef.trapTime = 0;
                bossHPFill.style.width = (bossRef.hp / Math.max(1, bossRef.maxHP) * 100) + '%';
                showFloatScore(bossRef.x, bossRef.y - 40, '💔 HP -1 (' + bossRef.hp + '/' + bossRef.maxHP + ')', '#FF8888', 18);
                if (bossRef.hp <= 0) {
                    killBee(i, true);
                }
            } else {
                console.log('[updateTrapped] Calling killBee(' + i + ') normal bee');
                killBee(i);
            }
        }
    }
}

function updatePowerups() {
    for (var i = powerups.length - 1; i >= 0; i--) {
        var p = powerups[i];
        p.y += p.vy;
        p.life--;
        var pulse = 1 + Math.sin(Date.now() / 100) * 0.15;
        ctx_c.save();
        ctx_c.translate(p.x, p.y);
        ctx_c.scale(pulse, pulse);
        ctx_c.rotate(Date.now() / 500);
        ctx_c.shadowColor = '#00FFFF';
        ctx_c.shadowBlur = 15;
        var sz = 14;
        ctx_c.beginPath();
        ctx_c.moveTo(0, -sz);
        ctx_c.lineTo(sz * 0.6, -sz * 0.2);
        ctx_c.lineTo(sz * 0.1, -sz * 0.2);
        ctx_c.lineTo(sz * 0.8, sz);
        ctx_c.lineTo(sz * 0.1, sz * 0.3);
        ctx_c.lineTo(-sz * 0.4, sz * 0.3);
        ctx_c.lineTo(-sz * 0.3, -sz * 0.2);
        ctx_c.lineTo(sz * 0.2, -sz * 0.2);
        ctx_c.closePath();
        ctx_c.fillStyle = '#00E5FF';
        ctx_c.fill();
        ctx_c.strokeStyle = '#fff';
        ctx_c.lineWidth = 1.5;
        ctx_c.stroke();
        ctx_c.restore();
        var dx = p.x - chipmunk.x;
        var dy = p.y - chipmunk.y;
        if (Math.sqrt(dx * dx + dy * dy) < 45) {
            G.powerShots = 10;
            showFloatScore(p.x, p.y, '⚡ 能量满!', '#00E5FF', 20);
            for (var k = 0; k < 10; k++) {
                particles.push(new Particle(p.x, p.y, '#00E5FF', 'ring'));
            }
            AudioSys.powerup();
            powerups.splice(i, 1);
            continue;
        }
        if (p.life <= 0) powerups.splice(i, 1);
    }
}

// ===== UI =====
function updateLives() {
    var s = '';
    for (var i = 0; i < 3; i++) {
        s += i < G.lives ? '❤️' : '🖤';
    }
    livesEl.textContent = s;
}

function showFloatScore(x, y, text, color, size) {
    var el = document.createElement('div');
    el.className = 'float-score';
    el.textContent = text;
    var sc = getScale();
    el.style.left = (x * sc.sx) + 'px';
    el.style.top = (y * sc.sy) + 'px';
    el.style.color = color;
    el.style.fontSize = size + 'px';
    document.getElementById('gameContainer').appendChild(el);
    setTimeout(function() { el.remove(); }, 1000);
}

function showLevelBanner(lv, label) {
    levelInfoEl.classList.remove('hidden');
    levelInfoEl.innerHTML = '<span style="font-size:28px">🗡️ 关卡 ' + lv + '</span><br><span style="font-size:16px;color:#FFD700">' + label + '</span>';
    setTimeout(function() { levelInfoEl.classList.add('hidden'); }, 2500);
}

// ===== 游戏流程 =====
function startGame() {
    AudioSys.init();
    AudioSys.resume();
    G = {
        score: 0,
        lives: 3,
        running: true,
        level: 1,
        combo: 0,
        mouseX: W / 2,
        mouseY: H / 2,
        mouseDown: false,
        powerShots: 0,
        moveLeft: false,
        moveRight: false,
        spaceDown: false,
        aimUp: false,
        aimDown: false,
        useKeyAim: false
    };
    bubbles = [];
    bees = [];
    particles = [];
    stars = [];
    powerups = [];
    stingers = [];
    initBgParticles();
    scoreEl.textContent = '0';
    updateLives();
    comboEl.textContent = '';
    startScreenEl.classList.add('hidden');
    gameOverEl.classList.add('hidden');
    AudioSys.startBGM();
    console.log('%c🎮 Game Started!', 'color:green;font-size:16px');
    loadLevel(1);
    lastShootTime = 0;
    requestAnimationFrame(gameLoop);
}

function restartGame() {
    startGame();
}

function endGame(win) {
    G.running = false;
    AudioSys.stopBGM();
    if (win) {
        finalScoreEl.textContent = '🏆 通关! ' + G.score;
        finalLevelEl.textContent = G.level + '/10';
    } else {
        finalScoreEl.textContent = G.score;
        finalLevelEl.textContent = G.level;
    }
    gameOverEl.classList.remove('hidden');
    AudioSys.gameOverSnd();
}

function toggleMute() {
    var m = AudioSys.toggleMute();
    document.getElementById('muteBtn').textContent = m ? '🔇' : '🔊';
}

// ===== 事件监听 =====
canvas.addEventListener('mousemove', function(e) {
    var rect = canvas.getBoundingClientRect();
    G.mouseX = e.clientX - rect.left;
    G.mouseY = e.clientY - rect.top;
    if (!G.useKeyAim) {
        chipmunk.angle = Math.atan2(G.mouseY - chipmunk.y, G.mouseX - chipmunk.x);
    }
});
canvas.addEventListener('mousedown', function(e) {
    G.mouseDown = true;
    G.useKeyAim = false;
});
canvas.addEventListener('mouseup', function() {
    G.mouseDown = false;
});
canvas.addEventListener('mouseleave', function() {
    G.mouseDown = false;
});

// 触摸支持
canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    G.mouseDown = true;
    var t = e.touches[0];
    G.mouseX = toLogicX(t.clientX);
    G.mouseY = toLogicY(t.clientY);
    chipmunk.angle = Math.atan2(G.mouseY - chipmunk.y, G.mouseX - chipmunk.x);
}, { passive: false });
canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    G.mouseX = toLogicX(t.clientX);
    G.mouseY = toLogicY(t.clientY);
    chipmunk.angle = Math.atan2(G.mouseY - chipmunk.y, G.mouseX - chipmunk.x);
}, { passive: false });
canvas.addEventListener('touchend', function() {
    G.mouseDown = false;
});

// 手机虚拟方向键
(function setupMobileButtons(){
    var bL=document.getElementById('btnLeft'),bR=document.getElementById('btnRight');
    function pL(e){e.preventDefault();e.stopPropagation();G.moveLeft=true}
    function rL(e){e.stopPropagation&&e.stopPropagation();G.moveLeft=false}
    function pR(e){e.preventDefault();e.stopPropagation();G.moveRight=true}
    function rR(e){e.stopPropagation&&e.stopPropagation();G.moveRight=false}
    bL.addEventListener('touchstart',pL,{passive:false});
    bL.addEventListener('touchend',rL);
    bL.addEventListener('touchcancel',rL);
    bR.addEventListener('touchstart',pR,{passive:false});
    bR.addEventListener('touchend',rR);
    bR.addEventListener('touchcancel',rR);
    bL.addEventListener('mousedown',function(e){e.preventDefault();G.moveLeft=true});
    bL.addEventListener('mouseup',rL);
    bL.addEventListener('mouseleave',rL);
    bR.addEventListener('mousedown',function(e){e.preventDefault();G.moveRight=true});
    bR.addEventListener('mouseup',rR);
    bR.addEventListener('mouseleave',rR);
})();

// 键盘控制
document.addEventListener('keydown', function(e) {
    if (!G.running) return;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { G.moveLeft = true; e.preventDefault(); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { G.moveRight = true; e.preventDefault(); }
    if (e.code === 'ArrowUp') { G.aimUp = true; G.useKeyAim = true; e.preventDefault(); }
    if (e.code === 'ArrowDown') { G.aimDown = true; G.useKeyAim = true; e.preventDefault(); }
    if (e.code === 'Space') { G.spaceDown = true; e.preventDefault(); }
});
document.addEventListener('keyup', function(e) {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') G.moveLeft = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') G.moveRight = false;
    if (e.code === 'ArrowUp') G.aimUp = false;
    if (e.code === 'ArrowDown') G.aimDown = false;
    if (e.code === 'Space') G.spaceDown = false;
});

// ===== 主循环 =====
var frameCount = 0;
function gameLoop(timestamp) {
    if (!G.running) return;
    frameCount = timestamp || 0;
    ctx_c.clearRect(0, 0, W, H);
    drawBackground(frameCount);
    spawnBee();

    // 花栗鼠左右移动
    var moveSpeed = 5;
    if (G.moveLeft) chipmunk.x = Math.max(30, chipmunk.x - moveSpeed);
    if (G.moveRight) chipmunk.x = Math.min(W - 30, chipmunk.x + moveSpeed);

    // 上下键调整炮管方向
    if (G.aimUp) chipmunk.angle = Math.max(-Math.PI + 0.15, chipmunk.angle - 0.04);
    if (G.aimDown) chipmunk.angle = Math.min(-0.15, chipmunk.angle + 0.04);

    // 空格/鼠标发射
    if (G.spaceDown) {
        if (G.powerShots > 0) { shootBubble(true); G.powerShots--; }
        else { shootBubble(false); }
    } else if (G.mouseDown) {
        if (G.powerShots > 0) { shootBubble(true); G.powerShots--; }
        else { shootBubble(false); }
    }

    // 更新泡泡
    for (var i = bubbles.length - 1; i >= 0; i--) {
        bubbles[i].update();
        bubbles[i].draw();
        if (bubbles[i].life <= 0 || bubbles[i].y < -30) bubbles.splice(i, 1);
    }

    // 更新蜜蜂
    bees.forEach(function(b) { b.update(); b.draw(); });

    // 更新蜂刺
    for (var i2 = stingers.length - 1; i2 >= 0; i2--) {
        stingers[i2].update();
        stingers[i2].draw();
        if (!stingers[i2].alive) stingers.splice(i2, 1);
    }

    // 更新粒子
    for (var i3 = particles.length - 1; i3 >= 0; i3--) {
        particles[i3].update();
        particles[i3].draw();
        if (particles[i3].life <= 0) particles.splice(i3, 1);
    }

    // 更新星星
    for (var i4 = stars.length - 1; i4 >= 0; i4--) {
        stars[i4].update();
        stars[i4].draw();
        if (stars[i4].y < -20) stars.splice(i4, 1);
    }

    // 能量道具
    updatePowerups();

    // 画花栗鼠
    chipmunk.draw();

    // 碰撞检测
    checkCollisions();
    updateTrappedBees();

    // 关卡检测
    checkLevelComplete();

    // 能量状态提示
    if (G.powerShots > 0) {
        ctx_c.save();
        ctx_c.font = 'bold 14px Arial';
        ctx_c.fillStyle = '#00E5FF';
        ctx_c.textAlign = 'left';
        ctx_c.shadowColor = '#00E5FF';
        ctx_c.shadowBlur = 8;
        ctx_c.fillText('⚡ 能量弹 x' + G.powerShots, 20, H - 20);
        ctx_c.restore();
    }

    requestAnimationFrame(gameLoop);
}
